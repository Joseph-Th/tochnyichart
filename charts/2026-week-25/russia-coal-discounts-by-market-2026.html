<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russian Coal Discounts by Market — 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">
        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-21</div>
        </div>

        <h1 class="tochnyi-title">How Deeply Russia Discounts Its Coal</h1>
        <p class="tochnyi-subtitle">Discount to benchmark prices by destination. China demands the steepest cut on thermal coal; South Korea — Russia's cheapest option — the smallest.</p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark small" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Tochnyi analysis of Asian coal markets — 2026
        </div>
        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>
    </div>

    <script>
        am5.ready(function() {
            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false, panY: false, wheelX: "none", wheelY: "none",
                paddingLeft: 0, paddingRight: 100, paddingTop: 10, paddingBottom: 10,
                layout: root.horizontalLayout
            }));

            // value = midpoint for bar length; tag shows full range
            var data = [
                { market: "South Korea", value: 11, color: 0x0088ff, tag: "11%" },
                { market: "India", value: 15, color: 0x005bbb, tag: "12–18%" },
                { market: "China", value: 17.5, color: 0x003d7a, tag: "15–20%" }
            ];

            var yRenderer = am5xy.AxisRendererY.new(root, { inversed: true, minGridDistance: 20 });
            yRenderer.labels.template.setAll({ fontSize: 17, fontFamily: "Mukta", fontWeight: "600", paddingRight: 8 });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.08 });
            var yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "market", renderer: yRenderer }));
            yAxis.data.setAll(data);

            var xRenderer = am5xy.AxisRendererX.new(root, { strokeOpacity: 0.3 });
            xRenderer.labels.template.setAll({ fontSize: 14, fontFamily: "Mukta", fontWeight: "500" });
            xRenderer.grid.template.setAll({ strokeOpacity: 0.12 });
            var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                min: 0, max: 22, strictMinMax: true, numberFormat: "#'%'", renderer: xRenderer
            }));
            xAxis.children.push(am5.Label.new(root, {
                text: "DISCOUNT TO BENCHMARK", x: am5.percent(50), centerX: am5.percent(50),
                fontSize: 14, fontWeight: "600", fontFamily: "Mukta", fill: am5.color(0x666666), paddingTop: 8
            }));

            var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                xAxis: xAxis, yAxis: yAxis, valueXField: "value", categoryYField: "market",
                tooltip: am5.Tooltip.new(root, { labelText: "{market}: {tag} discount" })
            }));
            series.columns.template.setAll({ height: am5.percent(55), cornerRadiusTR: 6, cornerRadiusBR: 6 });
            series.columns.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem; return di ? am5.color(di.dataContext.color) : fill;
            });
            series.columns.template.adapters.add("stroke", function(stroke, target) {
                var di = target.dataItem; return di ? am5.color(di.dataContext.color) : stroke;
            });
            series.bullets.push(function() {
                return am5.Bullet.new(root, { locationX: 1, sprite: am5.Label.new(root, {
                    text: "{tag}", fontSize: 18, fontFamily: "Mukta", fontWeight: "700",
                    fill: am5.color(0x020303), centerY: am5.percent(50), centerX: am5.percent(0),
                    paddingLeft: 8, populateText: true }) });
            });
            series.data.setAll(data);
            chart.appear(1000, 100);
        });
    </script>
</body>
</html>
