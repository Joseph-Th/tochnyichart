<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moscow Warehouse Vacancy — Highest Since 2016</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">
        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-21</div>
        </div>

        <h1 class="tochnyi-title">Moscow's Warehouses Are Emptying Out</h1>
        <p class="tochnyi-subtitle">By the end of 2026, vacant space in Moscow warehouses may climb to <span class="tochnyi-highlight">8.2%</span> — the highest level since 2016.</p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Kommersant (kommersant.ru/doc/8741364) — June 2026
        </div>
        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>
    </div>

    <script>
        am5.ready(function() {
            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false, panY: false, wheelX: "none", wheelY: "none",
                paddingLeft: 10, paddingRight: 10, layout: root.verticalLayout
            }));

            var data = [
                { period: "Forecast end-2026", value: 8.2, color: 0x005bbb, tag: "8.2%" }
            ];

            var xRenderer = am5xy.AxisRendererX.new(root, { cellStartLocation: 0.3, cellEndLocation: 0.7, minGridDistance: 30 });
            xRenderer.labels.template.setAll({ fontSize: 19, fontFamily: "Mukta", fontWeight: "600" });
            xRenderer.grid.template.setAll({ visible: false });
            var xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "period", renderer: xRenderer }));
            xAxis.data.setAll(data);

            var yRenderer = am5xy.AxisRendererY.new(root, { strokeOpacity: 0.3 });
            yRenderer.labels.template.setAll({ fontSize: 16, fontFamily: "Mukta", fontWeight: "500" });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.15 });
            var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                min: 0, max: 10, strictMinMax: true, numberFormat: "#.#'%'", renderer: yRenderer
            }));
            yAxis.children.unshift(am5.Label.new(root, {
                rotation: -90, text: "WAREHOUSE VACANCY RATE", y: am5.percent(50), centerX: am5.percent(50),
                fontSize: 14, fontWeight: "600", fontFamily: "Mukta", fill: am5.color(0x666666)
            }));

            var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                xAxis: xAxis, yAxis: yAxis, valueYField: "value", categoryXField: "period",
                tooltip: am5.Tooltip.new(root, { labelText: "{period}: {tag}" })
            }));
            series.columns.template.setAll({ width: am5.percent(40), cornerRadiusTL: 6, cornerRadiusTR: 6,
                fill: am5.color(0x005bbb), stroke: am5.color(0x005bbb) });
            series.bullets.push(function() {
                return am5.Bullet.new(root, { locationY: 1, sprite: am5.Label.new(root, {
                    text: "{tag}", fill: am5.color(0x020303), centerY: am5.percent(100), centerX: am5.percent(50),
                    populateText: true, fontSize: 30, fontWeight: "700", fontFamily: "Mukta", paddingBottom: 8 }) });
            });
            series.data.setAll(data);

            // Highest since 2016 reference line
            var refRange = yAxis.createAxisRange(yAxis.makeDataItem({ value: 8.2 }));
            refRange.get("grid").setAll({ stroke: am5.color(0xb30000), strokeOpacity: 0.6, strokeDasharray: [6, 4] });
            refRange.get("label").setAll({
                text: "Highest since 2016", fontSize: 13, fontFamily: "Mukta", fontWeight: "600",
                fill: am5.color(0xb30000), above: true, centerX: 0, paddingLeft: 6
            });

            chart.appear(1000, 100);
        });
    </script>
</body>
</html>
