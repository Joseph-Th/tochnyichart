<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia Honey Sales — Jan–May 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">
        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-21</div>
        </div>

        <h1 class="tochnyi-title">Pricier Honey, Emptier Jars</h1>
        <p class="tochnyi-subtitle">January–May 2026: honey prices rose <span class="tochnyi-highlight">12–16%</span> year over year, and physical sales volumes fell <span class="tochnyi-highlight">7–8%</span> as a result.</p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark small" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Kommersant (kommersant.ru/doc/8739516) — June 2026
        </div>
        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>
    </div>

    <script>
        am5.ready(function() {
            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false, panY: false, wheelX: "none", wheelY: "none",
                paddingLeft: 10, paddingRight: 10, layout: root.verticalLayout
            }));

            var data = [
                { metric: "Average price\n(year over year)", value: 14, color: 0x005bbb, tag: "+12 to +16%" },
                { metric: "Sales volume\n(year over year)", value: -7.5, color: 0xb30000, tag: "−7 to −8%" }
            ];

            var xRenderer = am5xy.AxisRendererX.new(root, { cellStartLocation: 0.2, cellEndLocation: 0.8, minGridDistance: 30 });
            xRenderer.labels.template.setAll({ fontSize: 18, fontFamily: "Mukta", fontWeight: "600" });
            xRenderer.grid.template.setAll({ visible: false });
            var xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, { categoryField: "metric", renderer: xRenderer }));
            xAxis.data.setAll(data);

            var yRenderer = am5xy.AxisRendererY.new(root, { strokeOpacity: 0.3 });
            yRenderer.labels.template.setAll({ fontSize: 16, fontFamily: "Mukta", fontWeight: "500" });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.15 });
            var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                min: -12, max: 20, strictMinMax: true, numberFormat: "#'%'", renderer: yRenderer
            }));
            yAxis.children.unshift(am5.Label.new(root, {
                rotation: -90, text: "CHANGE YEAR OVER YEAR", y: am5.percent(50), centerX: am5.percent(50),
                fontSize: 14, fontWeight: "600", fontFamily: "Mukta", fill: am5.color(0x666666)
            }));

            var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                xAxis: xAxis, yAxis: yAxis, valueYField: "value", categoryXField: "metric",
                tooltip: am5.Tooltip.new(root, { labelText: "{metric}: {tag}" })
            }));
            series.columns.template.setAll({ width: am5.percent(50), cornerRadiusTL: 6, cornerRadiusTR: 6 });
            series.columns.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem; return di ? am5.color(di.dataContext.color) : fill;
            });
            series.columns.template.adapters.add("stroke", function(stroke, target) {
                var di = target.dataItem; return di ? am5.color(di.dataContext.color) : stroke;
            });
            series.bullets.push(function(root, series, dataItem) {
                var neg = dataItem.dataContext.value < 0;
                return am5.Bullet.new(root, { locationY: 1, sprite: am5.Label.new(root, {
                    text: dataItem.dataContext.tag, fill: am5.color(0x020303),
                    centerY: neg ? am5.percent(0) : am5.percent(100), centerX: am5.percent(50),
                    paddingTop: neg ? 8 : 0, paddingBottom: neg ? 0 : 8,
                    fontSize: 20, fontWeight: "700", fontFamily: "Mukta" }) });
            });
            series.data.setAll(data);

            // zero reference line
            var zeroRange = yAxis.createAxisRange(yAxis.makeDataItem({ value: 0 }));
            zeroRange.get("grid").setAll({ stroke: am5.color(0x020303), strokeOpacity: 0.5 });

            chart.appear(1000, 100);
        });
    </script>
</body>
</html>
