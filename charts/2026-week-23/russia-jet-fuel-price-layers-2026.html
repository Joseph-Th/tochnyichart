<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia Jet Fuel Price Ladder May 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">Russia Jet Fuel Price Ladder — May 2026</h1>
        <p class="tochnyi-subtitle">Actual wholesale <span class="tochnyi-highlight">33% above</span> exchange price; export price <span class="tochnyi-highlight">2× domestic</span> — rubles per ton</p>

        <div id="chartdiv" class="tochnyi-chart-container short">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: SPIMEX, FAS Russia, industry insiders — May 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                paddingLeft: 0,
                paddingRight: 50,
                paddingTop: 10,
                paddingBottom: 10,
                layout: root.horizontalLayout
            }));

            var data = [
                {
                    label: "Govt Fixed Reference Price\n(subsidy calculation base, 2026)",
                    value: 67300,
                    color: 0x666666,
                    detail: "67,300 ₽/t — fixed reference price used to calculate airline fuel subsidies"
                },
                {
                    label: "SPIMEX Exchange Price\n(May 11, 2026)",
                    value: 82700,
                    color: 0x005bbb,
                    detail: "82,700 ₽/t — official exchange price; +14% since February. Nearly no fuel sold on SPIMEX after May 13."
                },
                {
                    label: "Actual Wholesale Price\n(industry estimate, May 2026)",
                    value: 110000,
                    color: 0xcc9900,
                    detail: "~110,000 ₽/t — real domestic wholesale price per industry insiders; 33% above SPIMEX"
                },
                {
                    label: "Export Port Price\n(NW ports, April 2026)",
                    value: 140890,
                    color: 0xb30000,
                    detail: "140,890 ₽/t — average export price from NW ports in April 2026 (FAS Russia)"
                }
            ];

            // Y axis — categories
            var yRenderer = am5xy.AxisRendererY.new(root, {
                inversed: false,
                minGridDistance: 20
            });
            yRenderer.labels.template.setAll({
                fontSize: 15,
                fontFamily: "Mukta",
                fontWeight: "500",
                maxWidth: 230,
                oversizedBehavior: "wrap",
                textAlign: "right",
                paddingRight: 8
            });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.08 });

            var yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "label",
                renderer: yRenderer
            }));
            yAxis.data.setAll(data);

            // X axis — price in rubles
            var xRenderer = am5xy.AxisRendererX.new(root, { strokeOpacity: 0.3 });
            xRenderer.labels.template.setAll({
                fontSize: 14,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            xRenderer.grid.template.setAll({ strokeOpacity: 0.12 });

            var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                min: 0,
                max: 165000,
                strictMinMax: true,
                numberFormat: "#,###",
                renderer: xRenderer
            }));

            xAxis.children.push(am5.Label.new(root, {
                text: "RUBLES PER TON",
                x: am5.percent(50),
                centerX: am5.percent(50),
                fontSize: 14,
                fontWeight: "600",
                fontFamily: "Mukta",
                fill: am5.color(0x666666),
                paddingTop: 8
            }));

            var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                xAxis: xAxis,
                yAxis: yAxis,
                valueXField: "value",
                categoryYField: "label",
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{detail}",
                    getFillFromSprite: false,
                    background: am5.Rectangle.new(root, {
                        fill: am5.color(0x020303),
                        fillOpacity: 0.85,
                        cornerRadiusTL: 4,
                        cornerRadiusTR: 4,
                        cornerRadiusBL: 4,
                        cornerRadiusBR: 4
                    })
                })
            }));

            series.columns.template.setAll({
                height: am5.percent(55),
                cornerRadiusTR: 5,
                cornerRadiusBR: 5
            });

            series.columns.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return fill;
            });
            series.columns.template.adapters.add("stroke", function(stroke, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return stroke;
            });

            // Value label to the right of each bar
            series.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationX: 1,
                    sprite: am5.Label.new(root, {
                        text: "{valueX.formatNumber('#,###')} ₽/t",
                        fontSize: 16,
                        fontFamily: "Mukta",
                        fontWeight: "700",
                        fill: am5.color(0x020303),
                        centerY: am5.percent(50),
                        centerX: am5.percent(0),
                        paddingLeft: 10,
                        populateText: true
                    })
                });
            });

            series.data.setAll(data);
            chart.appear(1000, 100);

        });
    </script>
</body>
</html>
