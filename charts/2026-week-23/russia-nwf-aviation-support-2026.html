<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia National Welfare Fund — Civil Aviation Support 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">National Welfare Fund — Civil Aviation Support</h1>
        <p class="tochnyi-subtitle">New <span class="tochnyi-highlight">67 billion ruble</span> allocation brings total civil aviation industry support to <span class="tochnyi-highlight">350.8 billion rubles</span></p>

        <div id="chartdiv" class="tochnyi-chart-container short">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Russian Government — June 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                paddingLeft: 10,
                paddingRight: 10,
                layout: root.verticalLayout
            }));

            // 350.8 total; new = 67; previous = 350.8 - 67 = 283.8
            var data = [
                { category: "Civil Aviation\nNWF Support", previous: 283.8, addition: 67 }
            ];

            var xRenderer = am5xy.AxisRendererX.new(root, {
                cellStartLocation: 0.25,
                cellEndLocation: 0.75,
                minGridDistance: 30
            });
            xRenderer.labels.template.setAll({
                fontSize: 20,
                fontFamily: "Mukta",
                fontWeight: "600"
            });
            xRenderer.grid.template.setAll({ visible: false });

            var xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "category",
                renderer: xRenderer
            }));
            xAxis.data.setAll(data);

            var yRenderer = am5xy.AxisRendererY.new(root, { strokeOpacity: 0.3 });
            yRenderer.labels.template.setAll({
                fontSize: 16,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.15 });

            var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                min: 0,
                max: 420,
                strictMinMax: true,
                numberFormat: "#",
                renderer: yRenderer
            }));

            yAxis.children.unshift(am5.Label.new(root, {
                rotation: -90,
                text: "BILLION RUBLES",
                y: am5.percent(50),
                centerX: am5.percent(50),
                fontSize: 15,
                fontWeight: "600",
                fontFamily: "Mukta",
                fill: am5.color(0x666666)
            }));

            // Previous allocation series
            var seriesPrev = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: "Previous allocations (283.8B ₽)",
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "previous",
                categoryXField: "category",
                stacked: true,
                fill: am5.color(0x005bbb),
                stroke: am5.color(0x005bbb),
                tooltip: am5.Tooltip.new(root, {
                    labelText: "Previous allocations: 283.8 billion rubles"
                })
            }));

            seriesPrev.columns.template.setAll({
                width: am5.percent(55),
                cornerRadiusTL: 0,
                cornerRadiusTR: 0
            });

            seriesPrev.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationY: 0.5,
                    sprite: am5.Label.new(root, {
                        text: "283.8B ₽\nprevious",
                        fill: am5.color(0xffffff),
                        centerY: am5.percent(50),
                        centerX: am5.percent(50),
                        populateText: true,
                        fontSize: 18,
                        fontWeight: "600",
                        fontFamily: "Mukta",
                        textAlign: "center"
                    })
                });
            });

            // New allocation series (stacked on top)
            var seriesNew = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: "New June 2026 allocation (67B ₽)",
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "addition",
                categoryXField: "category",
                stacked: true,
                fill: am5.color(0xffd500),
                stroke: am5.color(0xcc9900),
                tooltip: am5.Tooltip.new(root, {
                    labelText: "New allocation: 67 billion rubles\nTotal: 350.8 billion rubles"
                })
            }));

            seriesNew.columns.template.setAll({
                width: am5.percent(55),
                cornerRadiusTL: 6,
                cornerRadiusTR: 6,
                strokeWidth: 2
            });

            seriesNew.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationY: 0.5,
                    sprite: am5.Label.new(root, {
                        text: "+67B ₽ new",
                        fill: am5.color(0x020303),
                        centerY: am5.percent(50),
                        centerX: am5.percent(50),
                        populateText: true,
                        fontSize: 18,
                        fontWeight: "700",
                        fontFamily: "Mukta"
                    })
                });
            });

            // Total label above stacked bar
            seriesNew.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationY: 1,
                    sprite: am5.Label.new(root, {
                        text: "Total: 350.8B ₽",
                        fill: am5.color(0x020303),
                        centerY: am5.percent(100),
                        centerX: am5.percent(50),
                        populateText: true,
                        fontSize: 26,
                        fontWeight: "700",
                        fontFamily: "Mukta",
                        paddingBottom: 10
                    })
                });
            });

            seriesPrev.data.setAll(data);
            seriesNew.data.setAll(data);

            // Legend
            var legend = chart.children.push(am5.Legend.new(root, {
                centerX: am5.percent(50),
                x: am5.percent(50),
                marginTop: 16
            }));
            legend.labels.template.setAll({
                fontSize: 16,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            legend.data.setAll(chart.series.values);

            chart.appear(1000, 100);

        });
    </script>
</body>
</html>
