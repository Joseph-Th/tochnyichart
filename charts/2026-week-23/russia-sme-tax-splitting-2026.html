<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia SME Tax Burden &amp; Business Splitting Survey 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">Russia SME — Tax Burden &amp; Business Splitting Survey</h1>
        <p class="tochnyi-subtitle"><span class="tochnyi-highlight">80%</span> of entrepreneurs say tax burden is too great; <span class="tochnyi-highlight">33%</span> ready to split their business to reduce it</p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Opora Rossii survey of Russian entrepreneurs — 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                paddingLeft: 0,
                paddingRight: 80,
                paddingTop: 10,
                paddingBottom: 10,
                layout: root.horizontalLayout
            }));

            var data = [
                {
                    question: "Say tax burden\nis too great",
                    pct: 80,
                    color: 0xb30000,
                    label: "80%",
                    detail: "80% of SME entrepreneurs report the tax burden is excessive"
                },
                {
                    question: "Ready to split business\nto reduce taxes",
                    pct: 33,
                    color: 0xcc9900,
                    label: "33%",
                    detail: "33% of entrepreneurs say they are ready to split their business to avoid the tax burden"
                },
                {
                    question: "Have considered\nbusiness splitting",
                    pct: 21,
                    color: 0x005bbb,
                    label: "21%",
                    detail: "21% have considered splitting their business (subset of those who are 'ready')"
                },
                {
                    question: "Currently planning\nto split",
                    pct: 7,
                    color: 0x0088ff,
                    label: "7%",
                    detail: "7% are actively in the planning stage for splitting their business"
                },
                {
                    question: "Already split\ntheir business",
                    pct: 3,
                    color: 0x003d7a,
                    label: "3%",
                    detail: "3% have already split their business to reduce tax liability"
                }
            ];

            var yRenderer = am5xy.AxisRendererY.new(root, {
                inversed: false,
                minGridDistance: 15
            });
            yRenderer.labels.template.setAll({
                fontSize: 15,
                fontFamily: "Mukta",
                fontWeight: "500",
                maxWidth: 210,
                oversizedBehavior: "wrap",
                textAlign: "right",
                paddingRight: 8
            });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.08 });

            var yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "question",
                renderer: yRenderer
            }));
            yAxis.data.setAll(data);

            var xRenderer = am5xy.AxisRendererX.new(root, { strokeOpacity: 0.3 });
            xRenderer.labels.template.setAll({
                fontSize: 14,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            xRenderer.grid.template.setAll({ strokeOpacity: 0.12 });

            var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                min: 0,
                max: 100,
                strictMinMax: true,
                numberFormat: "#'%'",
                renderer: xRenderer
            }));

            var series = chart.series.push(am5xy.ColumnSeries.new(root, {
                xAxis: xAxis,
                yAxis: yAxis,
                valueXField: "pct",
                categoryYField: "question",
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{detail}",
                    getFillFromSprite: false,
                    background: am5.Rectangle.new(root, {
                        fill: am5.color(0x020303),
                        fillOpacity: 0.88,
                        cornerRadiusTL: 4, cornerRadiusTR: 4,
                        cornerRadiusBL: 4, cornerRadiusBR: 4
                    })
                })
            }));

            series.columns.template.setAll({
                height: am5.percent(55),
                cornerRadiusTR: 5,
                cornerRadiusBR: 5
            });

            series.columns.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return fill;
            });
            series.columns.template.adapters.add("stroke", function(stroke, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return stroke;
            });

            series.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationX: 1,
                    sprite: am5.Label.new(root, {
                        text: "{label}",
                        fontSize: 22,
                        fontFamily: "Mukta",
                        fontWeight: "700",
                        fill: am5.color(0x020303),
                        centerY: am5.percent(50),
                        centerX: am5.percent(0),
                        paddingLeft: 10,
                        populateText: true
                    })
                });
            });

            series.data.setAll(data);
            chart.appear(1000, 100);

        });
    </script>
</body>
</html>
