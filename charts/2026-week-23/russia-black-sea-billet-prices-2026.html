<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia Black Sea Steel Billet Export Price Ladder 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">Black Sea Steel Billet Export Price Ladder — June 2026</h1>
        <p class="tochnyi-subtitle">Russian FOB prices slip on weak Turkish demand; <span class="tochnyi-highlight">offer-bid gap persists</span> — USD per ton</p>

        <div id="chartdiv" class="tochnyi-chart-container short">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Market reports — week of May 29, 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false, panY: false, wheelX: "none", wheelY: "none",
                paddingLeft: 0, paddingRight: 70,
                paddingTop: 10, paddingBottom: 10,
                layout: root.horizontalLayout
            }));

            var data = [
                {
                    label: "Russian Black Sea FOB\n(prior week, May 22)",
                    mid: 489, low: 488, high: 490,
                    color: 0x888888,
                    tag: "488–490 $/t"
                },
                {
                    label: "Russian Black Sea FOB\n(week of May 29)",
                    mid: 486.5, low: 485, high: 488,
                    color: 0x005bbb,
                    tag: "485–488 $/t"
                },
                {
                    label: "Turkish buyer bid\n(CFR Turkey)",
                    mid: 507.5, low: 505, high: 510,
                    color: 0xcc9900,
                    tag: "505–510 $/t"
                },
                {
                    label: "Russian seller offer\n(CFR Turkey)",
                    mid: 517.5, low: 515, high: 520,
                    color: 0xb30000,
                    tag: "515–520 $/t"
                },
                {
                    label: "Chinese billet CFR Turkey\n(July–Aug delivery)",
                    mid: 527.5, low: 525, high: 530,
                    color: 0x003d7a,
                    tag: "525–530 $/t"
                }
            ];

            var yRenderer = am5xy.AxisRendererY.new(root, { inversed: false, minGridDistance: 20 });
            yRenderer.labels.template.setAll({
                fontSize: 14, fontFamily: "Mukta", fontWeight: "500",
                maxWidth: 220, oversizedBehavior: "wrap", textAlign: "right", paddingRight: 8
            });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.08 });

            var yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "label", renderer: yRenderer
            }));
            yAxis.data.setAll(data);

            var xRenderer = am5xy.AxisRendererX.new(root, { strokeOpacity: 0.3 });
            xRenderer.labels.template.setAll({ fontSize: 14, fontFamily: "Mukta", fontWeight: "500" });
            xRenderer.grid.template.setAll({ strokeOpacity: 0.12 });

            var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                min: 470, max: 550, strictMinMax: true,
                numberFormat: "#",
                renderer: xRenderer
            }));
            xAxis.children.push(am5.Label.new(root, {
                text: "USD PER TON",
                x: am5.percent(50), centerX: am5.percent(50),
                fontSize: 14, fontWeight: "600", fontFamily: "Mukta",
                fill: am5.color(0x666666), paddingTop: 8
            }));

            // Low bar (open at 470 for visual context)
            var seriesBar = chart.series.push(am5xy.ColumnSeries.new(root, {
                xAxis: xAxis, yAxis: yAxis,
                openValueXField: "low", valueXField: "high",
                categoryYField: "label",
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{label}: {tag}",
                    getFillFromSprite: false,
                    background: am5.Rectangle.new(root, {
                        fill: am5.color(0x020303), fillOpacity: 0.88,
                        cornerRadiusTL: 4, cornerRadiusTR: 4, cornerRadiusBL: 4, cornerRadiusBR: 4
                    })
                })
            }));
            seriesBar.columns.template.setAll({
                height: am5.percent(42),
                cornerRadiusTR: 4, cornerRadiusBR: 4,
                cornerRadiusTL: 4, cornerRadiusBL: 4
            });
            seriesBar.columns.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem; return di ? am5.color(di.dataContext.color) : fill;
            });
            seriesBar.columns.template.adapters.add("stroke", function(stroke, target) {
                var di = target.dataItem; return di ? am5.color(di.dataContext.color) : stroke;
            });

            // Mid-point tick
            var seriesMid = chart.series.push(am5xy.ColumnSeries.new(root, {
                xAxis: xAxis, yAxis: yAxis,
                openValueXField: "mid", valueXField: "mid",
                categoryYField: "label"
            }));
            seriesMid.columns.template.setAll({ height: am5.percent(80), strokeWidth: 3, fillOpacity: 0 });
            seriesMid.columns.template.adapters.add("stroke", function(stroke, target) {
                var di = target.dataItem; return di ? am5.color(di.dataContext.color) : stroke;
            });

            // Value labels to the right
            seriesBar.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationX: 1,
                    sprite: am5.Label.new(root, {
                        text: "{tag}",
                        fontSize: 15, fontFamily: "Mukta", fontWeight: "700",
                        fill: am5.color(0x020303),
                        centerY: am5.percent(50), centerX: am5.percent(0),
                        paddingLeft: 10, populateText: true
                    })
                });
            });

            // Bid-offer gap highlight
            var gapRange = xAxis.createAxisRange(xAxis.makeDataItem({ value: 510, endValue: 515 }));
            gapRange.get("axisFill").setAll({
                fill: am5.color(0xb30000), fillOpacity: 0.08, visible: true
            });
            gapRange.get("label").setAll({
                text: "gap",
                fontSize: 11, fontFamily: "Mukta", fontWeight: "700",
                fill: am5.color(0xb30000), above: true, inside: true,
                centerX: am5.percent(50), paddingBottom: 4
            });

            seriesBar.data.setAll(data);
            seriesMid.data.setAll(data);
            chart.appear(1000, 100);
        });
    </script>
</body>
</html>
