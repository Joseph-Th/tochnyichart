<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia 5G Device Compatibility 4.8-4.99 GHz</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/percent.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">Russia 5G Device Compatibility — 4.8–4.99 GHz Band</h1>
        <p class="tochnyi-subtitle">Only <span class="tochnyi-highlight">3%</span> of devices currently on the Russian market support Russia's allocated 5G frequencies</p>

        <div id="chartdiv" class="tochnyi-chart-container short">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark small" alt="">
            <div class="tochnyi-big-number">
                <div class="number">3%</div>
                <div class="label">compatible</div>
            </div>
        </div>

        <div class="tochnyi-source">
            Source: Russian telecom industry analysis — 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5percent.PieChart.new(root, {
                layout: root.horizontalLayout,
                innerRadius: am5.percent(65),
                radius: am5.percent(90)
            }));

            var data = [
                { category: "Supports 4.8–4.99 GHz\n(5G compatible)",      value: 3,  color: 0x005bbb },
                { category: "Does not support\nRussia 5G frequencies",       value: 97, color: 0xdddddd }
            ];

            var series = chart.series.push(am5percent.PieSeries.new(root, {
                valueField: "value",
                categoryField: "category",
                alignLabels: true,
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{category}: {value}%"
                })
            }));

            series.slices.template.setAll({
                strokeWidth: 3,
                stroke: am5.color(0xffffff)
            });

            series.slices.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return fill;
            });
            series.slices.template.adapters.add("stroke", function(stroke) { return am5.color(0xffffff); });

            series.labels.template.setAll({
                fontSize: 16,
                fontFamily: "Mukta",
                fontWeight: "500",
                text: "{category}\n[bold]{value}%[/]",
                maxWidth: 180,
                oversizedBehavior: "wrap"
            });

            series.ticks.template.setAll({ strokeOpacity: 0.3 });

            series.data.setAll(data);
            series.appear(1000, 100);

            // Center label
            chart.seriesContainer.children.push(am5.Label.new(root, {
                text: "of market\ndevices",
                fontSize: 15,
                fontFamily: "Mukta",
                fontWeight: "500",
                fill: am5.color(0x666666),
                textAlign: "center",
                centerX: am5.percent(50),
                centerY: am5.percent(50)
            }));

        });
    </script>
</body>
</html>
