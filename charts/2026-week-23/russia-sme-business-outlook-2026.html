<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia SME Business Outlook 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">Russia SME Business Outlook — 2026</h1>
        <p class="tochnyi-subtitle"><span class="tochnyi-highlight">80%</span> will make no investment this year; <span class="tochnyi-highlight">1 in 5</span> businesses planning to close down in 2026</p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Opora Rossii survey of Russian SME entrepreneurs — 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                paddingLeft: 10,
                paddingRight: 10,
                layout: root.verticalLayout
            }));

            var data = [
                { topic: "Investment plans 2026",   no: 80, yes: 20, noLabel: "80% — no investment",    yesLabel: "20% — will invest"      },
                { topic: "Business continuity 2026", no: 20, yes: 80, noLabel: "20% — planning to close", yesLabel: "80% — continuing ops" }
            ];

            var xRenderer = am5xy.AxisRendererX.new(root, {
                cellStartLocation: 0.1,
                cellEndLocation: 0.9,
                minGridDistance: 30
            });
            xRenderer.labels.template.setAll({
                fontSize: 18,
                fontFamily: "Mukta",
                fontWeight: "600",
                textAlign: "center",
                oversizedBehavior: "wrap",
                maxWidth: 200
            });
            xRenderer.grid.template.setAll({ visible: false });

            var xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "topic",
                renderer: xRenderer
            }));
            xAxis.data.setAll(data);

            var yRenderer = am5xy.AxisRendererY.new(root, { strokeOpacity: 0.3 });
            yRenderer.labels.template.setAll({
                fontSize: 16,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.15 });

            var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                min: 0,
                max: 100,
                strictMinMax: true,
                numberFormat: "#'%'",
                renderer: yRenderer
            }));

            yAxis.children.unshift(am5.Label.new(root, {
                rotation: -90,
                text: "SHARE OF RESPONDENTS",
                y: am5.percent(50),
                centerX: am5.percent(50),
                fontSize: 14,
                fontWeight: "600",
                fontFamily: "Mukta",
                fill: am5.color(0x666666)
            }));

            // "No / Negative" series — red (no investment; planning to close)
            var seriesNo = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: "No investment / Closing down",
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "no",
                categoryXField: "topic",
                stacked: true,
                fill: am5.color(0xb30000),
                stroke: am5.color(0xb30000),
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{noLabel}"
                })
            }));
            seriesNo.columns.template.setAll({
                width: am5.percent(65),
                cornerRadiusTL: 0,
                cornerRadiusTR: 0
            });
            seriesNo.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationY: 0.5,
                    sprite: am5.Label.new(root, {
                        text: "{noLabel}",
                        fill: am5.color(0xffffff),
                        centerY: am5.percent(50),
                        centerX: am5.percent(50),
                        populateText: true,
                        fontSize: 17,
                        fontWeight: "700",
                        fontFamily: "Mukta",
                        textAlign: "center",
                        maxWidth: 200,
                        oversizedBehavior: "wrap"
                    })
                });
            });

            // "Yes / Positive" series — blue/green
            var seriesYes = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: "Will invest / Continuing operations",
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "yes",
                categoryXField: "topic",
                stacked: true,
                fill: am5.color(0x005bbb),
                stroke: am5.color(0x005bbb),
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{yesLabel}"
                })
            }));
            seriesYes.columns.template.setAll({
                width: am5.percent(65),
                cornerRadiusTL: 6,
                cornerRadiusTR: 6
            });
            seriesYes.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationY: 0.5,
                    sprite: am5.Label.new(root, {
                        text: "{yesLabel}",
                        fill: am5.color(0xffffff),
                        centerY: am5.percent(50),
                        centerX: am5.percent(50),
                        populateText: true,
                        fontSize: 17,
                        fontWeight: "700",
                        fontFamily: "Mukta",
                        textAlign: "center",
                        maxWidth: 200,
                        oversizedBehavior: "wrap"
                    })
                });
            });

            var legend = chart.children.push(am5.Legend.new(root, {
                centerX: am5.percent(50),
                x: am5.percent(50),
                marginTop: 16
            }));
            legend.labels.template.setAll({
                fontSize: 15,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            legend.data.setAll(chart.series.values);

            seriesNo.data.setAll(data);
            seriesYes.data.setAll(data);
            chart.appear(1000, 100);

        });
    </script>
</body>
</html>
