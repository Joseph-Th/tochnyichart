<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turkey Billet Imports by Origin Q1 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">Turkey Billet Imports by Origin — Q1 2026 vs Q1 2025</h1>
        <p class="tochnyi-subtitle">Total imports <span class="tochnyi-highlight">+73.2% YoY</span> to 1.27 million tons; Russia leads, UAE surges <span class="tochnyi-highlight">+3,900%</span> — thousand tons</p>

        <div id="chartdiv" class="tochnyi-chart-container tall">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: Turkish official trade statistics — Q1 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false, panY: false, wheelX: "none", wheelY: "none",
                paddingLeft: 0, paddingRight: 40,
                paddingTop: 10, paddingBottom: 10,
                layout: root.horizontalLayout
            }));

            // Q1 2026 reported; Q1 2025 calculated
            // Russia: Q1 2026=387.94K, doubled → Q1 2025=193.97K
            // China: Q1 2026=251.56K, +150% → Q1 2025=100.62K
            // UAE: Q1 2026=114.9K, +3900% → Q1 2025=2.87K
            // Others: Q1 2026 total=1270K, named=754.4K → others=515.6K
            //         Q1 2025 total=1270/1.732=733K, named=297.46K → others=435.54K
            var data = [
                { origin: "Russia",        y2025: 193.97, y2026: 387.94, change: "×2.0"      },
                { origin: "China",         y2025: 100.62, y2026: 251.56, change: "+150%"     },
                { origin: "UAE",           y2025: 2.87,   y2026: 114.9,  change: "+3,900%"   },
                { origin: "Other origins", y2025: 435.54, y2026: 515.6,  change: "+18%"      }
            ];

            var yRenderer = am5xy.AxisRendererY.new(root, { inversed: false, minGridDistance: 10 });
            yRenderer.labels.template.setAll({
                fontSize: 17, fontFamily: "Mukta", fontWeight: "600",
                maxWidth: 160, oversizedBehavior: "wrap", textAlign: "right", paddingRight: 8
            });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.08 });

            var yAxis = chart.yAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "origin", renderer: yRenderer
            }));
            yAxis.data.setAll(data);

            var xRenderer = am5xy.AxisRendererX.new(root, {
                cellStartLocation: 0.1, cellEndLocation: 0.9, strokeOpacity: 0.3
            });
            xRenderer.labels.template.setAll({ fontSize: 14, fontFamily: "Mukta", fontWeight: "500" });
            xRenderer.grid.template.setAll({ strokeOpacity: 0.12 });

            var xAxis = chart.xAxes.push(am5xy.ValueAxis.new(root, {
                min: 0, max: 450, strictMinMax: true, numberFormat: "#",
                renderer: xRenderer
            }));
            xAxis.children.push(am5.Label.new(root, {
                text: "THOUSAND TONS",
                x: am5.percent(50), centerX: am5.percent(50),
                fontSize: 14, fontWeight: "600", fontFamily: "Mukta",
                fill: am5.color(0x666666), paddingTop: 8
            }));

            function makeSeries(name, field, color, clustered) {
                var s = chart.series.push(am5xy.ColumnSeries.new(root, {
                    name: name,
                    xAxis: xAxis, yAxis: yAxis,
                    valueXField: field, categoryYField: "origin",
                    clustered: true,
                    fill: am5.color(color), stroke: am5.color(color),
                    tooltip: am5.Tooltip.new(root, {
                        labelText: "{categoryY} — " + name + ": {valueX.formatNumber('#,###.#')}K t"
                    })
                }));
                s.columns.template.setAll({
                    height: am5.percent(42),
                    cornerRadiusTR: 4, cornerRadiusBR: 4
                });
                return s;
            }

            var s2025 = makeSeries("Q1 2025", "y2025", 0x005bbb);
            var s2026 = makeSeries("Q1 2026", "y2026", 0xffd500);
            s2026.columns.template.adapters.add("fill", function(fill) { return am5.color(0xffd500); });

            // Change label on Q1 2026 bar
            s2026.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationX: 1,
                    sprite: am5.Label.new(root, {
                        text: "{change}",
                        fontSize: 14, fontFamily: "Mukta", fontWeight: "700",
                        fill: am5.color(0x020303),
                        centerY: am5.percent(50), centerX: am5.percent(0),
                        paddingLeft: 8, populateText: true
                    })
                });
            });

            s2025.data.setAll(data);
            s2026.data.setAll(data);

            var legend = chart.children.push(am5.Legend.new(root, {
                centerX: am5.percent(50), x: am5.percent(50), marginTop: 16
            }));
            legend.labels.template.setAll({ fontSize: 16, fontFamily: "Mukta", fontWeight: "500" });
            legend.data.setAll(chart.series.values);

            // Total line annotation
            chart.children.push(am5.Label.new(root, {
                text: "Q1 2025 total: ~733K t   →   Q1 2026 total: 1,270K t  (+73.2%)   |   cost: 623.4M USD (+62.8%)",
                fontSize: 14, fontFamily: "Mukta", fontWeight: "500",
                fill: am5.color(0x005bbb),
                x: am5.percent(50), centerX: am5.percent(50),
                paddingTop: 10, textAlign: "center"
            }));

            chart.appear(1000, 100);
        });
    </script>
</body>
</html>
