<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Russia SPIMEX Fuel Prices — June 2, 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../lib/tochnyi.css">
    <script src="https://cdn.amcharts.com/lib/5/index.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/xy.js"></script>
    <script src="https://cdn.amcharts.com/lib/5/themes/Animated.js"></script>
    <script src="../../lib/tochnyi-charts.js"></script>
</head>
<body>
    <div class="tochnyi-chart">

        <div class="tochnyi-header">
            <img src="../../lib/tochnyi-logo.png" class="tochnyi-logo" alt="Tochnyi">
            <div class="tochnyi-date">Date: 2026-06-06</div>
        </div>

        <h1 class="tochnyi-title">Russia SPIMEX Wholesale Fuel Prices — June 2, 2026</h1>
        <p class="tochnyi-subtitle">Summer diesel surges <span class="tochnyi-highlight">+3.5%</span> in a single day — highest since October 2025 peak — rubles per ton</p>

        <div id="chartdiv" class="tochnyi-chart-container">
            <img src="../../lib/watermark.svg" class="tochnyi-watermark" alt="">
        </div>

        <div class="tochnyi-source">
            Source: SPIMEX exchange — June 2, 2026
        </div>

        <div class="tochnyi-footer">
            <span>Analysis by:</span>
            <a href="https://x.com/delfoo">@delfoo</a>
            <a href="https://bsky.app/profile/delfoo.bsky.social">@delfoo.bsky.social</a>
        </div>

    </div>

    <script>
        am5.ready(function() {

            var root = am5.Root.new("chartdiv");
            root.setThemes([am5themes_Animated.new(root)]);

            var chart = root.container.children.push(am5xy.XYChart.new(root, {
                panX: false,
                panY: false,
                wheelX: "none",
                wheelY: "none",
                paddingLeft: 10,
                paddingRight: 10,
                layout: root.verticalLayout
            }));

            // Prev day calculated: Diesel = 69790/1.035 = 67432; Ai92 = 68370/1.0026 = 68193; Ai95 = 75760/1.004 = 75457
            var data = [
                { fuel: "Summer Diesel",  prev: 67432, curr: 69790, change: "+3.5%",  color: 0xcc9900, peak: 73060 },
                { fuel: "Gasoline Ai-92", prev: 68193, curr: 68370, change: "+0.26%", color: 0x005bbb, peak: null  },
                { fuel: "Gasoline Ai-95", prev: 75457, curr: 75760, change: "+0.4%",  color: 0x003d7a, peak: null  }
            ];

            var xRenderer = am5xy.AxisRendererX.new(root, {
                cellStartLocation: 0.08,
                cellEndLocation: 0.92,
                minGridDistance: 30
            });
            xRenderer.labels.template.setAll({
                fontSize: 20,
                fontFamily: "Mukta",
                fontWeight: "600"
            });
            xRenderer.grid.template.setAll({ visible: false });

            var xAxis = chart.xAxes.push(am5xy.CategoryAxis.new(root, {
                categoryField: "fuel",
                renderer: xRenderer
            }));
            xAxis.data.setAll(data);

            var yRenderer = am5xy.AxisRendererY.new(root, { strokeOpacity: 0.3 });
            yRenderer.labels.template.setAll({
                fontSize: 16,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            yRenderer.grid.template.setAll({ strokeOpacity: 0.15 });

            var yAxis = chart.yAxes.push(am5xy.ValueAxis.new(root, {
                min: 60000,
                max: 82000,
                strictMinMax: true,
                numberFormat: "#,###",
                renderer: yRenderer
            }));

            yAxis.children.unshift(am5.Label.new(root, {
                rotation: -90,
                text: "RUBLES PER TON",
                y: am5.percent(50),
                centerX: am5.percent(50),
                fontSize: 15,
                fontWeight: "600",
                fontFamily: "Mukta",
                fill: am5.color(0x666666)
            }));

            // Previous day bars (lighter / faded)
            var seriesPrev = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: "Previous day",
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "prev",
                categoryXField: "fuel",
                clustered: true
            }));
            seriesPrev.columns.template.setAll({
                width: am5.percent(45),
                cornerRadiusTL: 4,
                cornerRadiusTR: 4,
                fillOpacity: 0.35,
                strokeOpacity: 0
            });
            seriesPrev.columns.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return fill;
            });
            seriesPrev.data.setAll(data);

            // Current day bars (full color)
            var seriesCurr = chart.series.push(am5xy.ColumnSeries.new(root, {
                name: "June 2, 2026",
                xAxis: xAxis,
                yAxis: yAxis,
                valueYField: "curr",
                categoryXField: "fuel",
                clustered: true,
                tooltip: am5.Tooltip.new(root, {
                    labelText: "{categoryX}: {valueY.formatNumber('#,###')} ₽/t  ({change})"
                })
            }));
            seriesCurr.columns.template.setAll({
                width: am5.percent(45),
                cornerRadiusTL: 4,
                cornerRadiusTR: 4
            });
            seriesCurr.columns.template.adapters.add("fill", function(fill, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return fill;
            });
            seriesCurr.columns.template.adapters.add("stroke", function(stroke, target) {
                var di = target.dataItem;
                if (di) return am5.color(di.dataContext.color);
                return stroke;
            });

            // Value + change label above current bar
            seriesCurr.bullets.push(function() {
                return am5.Bullet.new(root, {
                    locationY: 1,
                    sprite: am5.Label.new(root, {
                        text: "{valueY.formatNumber('#,###')}\n[bold]{change}[/]",
                        fill: am5.color(0x020303),
                        centerY: am5.percent(100),
                        centerX: am5.percent(50),
                        populateText: true,
                        fontSize: 17,
                        fontWeight: "500",
                        fontFamily: "Mukta",
                        paddingBottom: 8,
                        textAlign: "center"
                    })
                });
            });

            seriesPrev.data.setAll(data);
            seriesCurr.data.setAll(data);

            // October 2025 diesel peak reference line (73,060 — diesel only)
            var peakRange = yAxis.createAxisRange(yAxis.makeDataItem({ value: 73060 }));
            peakRange.get("grid").setAll({
                stroke: am5.color(0xb30000),
                strokeOpacity: 0.6,
                strokeDasharray: [6, 4]
            });
            peakRange.get("label").setAll({
                text: "Oct 6, 2025 diesel peak: 73,060 ₽/t",
                fontSize: 13,
                fontFamily: "Mukta",
                fontWeight: "600",
                fill: am5.color(0xb30000),
                above: true,
                centerX: 0,
                paddingLeft: 6
            });

            // Legend
            var legend = chart.children.push(am5.Legend.new(root, {
                centerX: am5.percent(50),
                x: am5.percent(50),
                marginTop: 16
            }));
            legend.labels.template.setAll({
                fontSize: 16,
                fontFamily: "Mukta",
                fontWeight: "500"
            });
            legend.data.setAll(chart.series.values);

            chart.appear(1000, 100);

        });
    </script>
</body>
</html>
